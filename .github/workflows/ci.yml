name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile bundles
        run: npm run compile

      - name: Run unit and integration tests
        run: npm test

      - name: Verify CLI invocation
        shell: bash
        run: |
          node out/cli.js --help
          node out/cli.js --version

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Validate NPM package bundle
        run: npm pack --dry-run

      - name: Validate VSIX packaging
        run: npm run package
